name: Amostra da voz clonada
# Teste: gera amostras da voz do Dheryck (clonada da gravação em voz/) e grava em amostras/ nesta branch.
on:
  push:
    branches: ['claude/**']
    paths: ['voz/**', 'gen/amostra/**', '.github/workflows/amostra-voz.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  amostra:
    strategy:
      fail-fast: false
      matrix:
        motor: [xtts, f5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Instalar
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.motor }}" = xtts ]; then pip install -q 'coqui-tts[codec]'; else pip install -q f5-tts; fi
          pip install -q numpy soundfile huggingface_hub
      - name: Gerar
        run: |
          ffmpeg -loglevel error -y -i voz/referencia-dheryck.m4a -ac 1 -ar 24000 /tmp/ref.wav
          python3 gen/amostra/texto.py > /tmp/texto.txt; cat /tmp/texto.txt
          python3 gen/amostra/${{ matrix.motor }}.py /tmp/ref.wav /tmp/out.wav
          mkdir -p amostras
          ffmpeg -loglevel error -y -i /tmp/out.wav -ac 1 -b:a 64k amostras/${{ matrix.motor }}.mp3
      - name: Guardar na branch
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add amostras/${{ matrix.motor }}.mp3
          git commit -m "Amostra ${{ matrix.motor }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF_NAME} && git push -q origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
