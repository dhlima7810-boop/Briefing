<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Briefing Diário</title>
<meta name="theme-color" content="#05051f">
<meta name="robots" content="noindex,nofollow">
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Zyra">
<meta name="application-name" content="Zyra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; background: #05051f; color: #e4e4e6; }
  #dash-root { padding: 0 var(--dash-gutter, 0); min-height: 100vh; }
  /* ---------- abertura: a rede neural do ícone ---------- */
  #bx-intro { position: fixed; inset: 0; z-index: 60; background: radial-gradient(70% 55% at 78% 12%, rgba(64, 40, 190, .55) 0%, rgba(64, 40, 190, 0) 70%), radial-gradient(60% 50% at 8% 88%, rgba(52, 46, 200, .45) 0%, rgba(52, 46, 200, 0) 70%), radial-gradient(50% 40% at 40% 45%, rgba(40, 22, 120, .35) 0%, rgba(40, 22, 120, 0) 70%), linear-gradient(180deg, #04041a 0%, #06062a 45%, #0a0838 100%); color: #e4e4e6; font-family: "BX Inter", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; transition: opacity .55s cubic-bezier(.4, 0, .2, 1) .85s, filter .9s ease; }
  html.bx-intro-on, html.bx-intro-on body { overflow: hidden; }
  #bx-intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #bx-intro canvas:active { cursor: grabbing; }
  #bx-intro .copy { position: absolute; left: max(24px, 6vw); right: 24px; bottom: max(32px, 8vh); max-width: 30rem; pointer-events: none; }
  #bx-intro .copy > * { pointer-events: auto; }
  #bx-intro .brand { position: absolute; top: max(20px, env(safe-area-inset-top)); left: max(24px, 6vw); display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: .02em; color: #fff; }
  #bx-intro .brand svg { width: 22px; height: 22px; }
  #bx-intro-hi { margin: 0; font-family: "BX Newsreader", Georgia, serif; font-weight: 400; font-size: clamp(40px, 6.4vw, 84px); line-height: 1.02; letter-spacing: -0.02em; color: #fff; text-wrap: balance; }
  #bx-intro-date { margin: 14px 0 0; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; color: #aeb2d8; }
  #bx-intro .load { margin-top: 28px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: #9a9cc8; min-height: 20px; }
  #bx-intro .track { flex: 0 0 120px; height: 2px; background: rgba(190, 182, 255, .16); border-radius: 2px; overflow: hidden; }
  #bx-intro-bar { display: block; height: 100%; background: linear-gradient(90deg, #7b54ff, #9fb6ff); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
  #bx-intro .acts { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; opacity: .35; transform: translateY(6px); transition: opacity .5s ease, transform .5s cubic-bezier(.2, .7, .2, 1); }
  #bx-intro.is-ready .acts { opacity: 1; transform: none; }
  #bx-intro .acts button { font: 600 14px/1 inherit; font-family: inherit; border-radius: 9999px; padding: 15px 22px; cursor: pointer; border: 1px solid transparent; transition: transform .2s ease, background-color .2s ease, border-color .2s ease; }
  #bx-intro .acts button:disabled { cursor: default; }
  #bx-intro-go { background: #6a4dff; color: #fff; box-shadow: 0 8px 28px -10px rgba(110, 84, 255, .9); display: inline-flex; align-items: center; gap: 10px; }
  #bx-intro-go:not(:disabled):hover { background: #7b60ff; transform: translateY(-1px); }
  #bx-intro-go i { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255, 255, 255, .6); }
  #bx-intro.is-ready #bx-intro-go i { animation: bx-intro-ping 1.8s ease-out infinite; }
  #bx-intro-read { background: rgba(10, 10, 46, .35); color: #e6e6ff; border-color: rgba(190, 182, 255, .28) !important; }
  #bx-intro-read:not(:disabled):hover { border-color: rgba(190, 182, 255, .6) !important; }
  #bx-intro ::selection { background: rgba(123, 84, 255, .45); color: #fff; }
  #bx-intro .acts button:focus-visible { outline: 2px solid #b9a8ff; outline-offset: 3px; }
  #bx-intro .hint { position: absolute; right: max(24px, 6vw); bottom: max(32px, 8vh); font-size: 12px; color: #9a9cc8; letter-spacing: .02em; pointer-events: none; }
  #bx-intro.is-failed .load { color: #ff7ac9; }
  #bx-intro.is-leaving { opacity: 0; pointer-events: none; }
  #bx-intro.is-leaving .copy, #bx-intro.is-leaving .brand, #bx-intro.is-leaving .hint { opacity: 0; transform: translateY(-10px); transition: opacity .35s ease, transform .35s ease; }
  html.bx-entering #dash-root { animation: bx-arrive 1.45s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes bx-arrive { 0% { transform: scale(1.06); filter: blur(10px); opacity: 0; } 55% { opacity: 0; } 100% { transform: none; filter: none; opacity: 1; } }
  @keyframes bx-intro-ping { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .6); } 100% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); } }
  @media (max-width: 759px) {
    #bx-intro .copy { left: 20px; right: 20px; bottom: max(24px, env(safe-area-inset-bottom)); }
    #bx-intro .brand { left: 20px; }
    #bx-intro .hint { display: none; }
    #bx-intro .acts button { flex: 1 1 auto; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    #bx-intro { transition: opacity .3s ease; }
    html.bx-entering #dash-root { animation: none; }
    #bx-intro.is-ready #bx-intro-go i { animation: none; }
  }
</style>
<link rel="stylesheet" href="fonts.css">
<script src="vendor/d3.min.js"></script>
</head>
<body>
<div id="bx-intro" role="dialog" aria-modal="true" aria-labelledby="bx-intro-hi">
  <canvas aria-hidden="true"></canvas>
  <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><g stroke="#8052ff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M146 300 L214 196 L300 236 L366 150 M214 196 L256 340 L300 236 M256 340 L366 330 L366 150"/></g><g fill="#fff"><circle cx="146" cy="300" r="30"/><circle cx="214" cy="196" r="32"/><circle cx="256" cy="340" r="28"/><circle cx="366" cy="330" r="28"/></g><circle cx="300" cy="236" r="42" fill="#ffb829"/><circle cx="366" cy="150" r="32" fill="#15846e"/></svg>Briefing</div>
  <div class="copy">
    <h1 id="bx-intro-hi">Bom dia.</h1>
    <p id="bx-intro-date"></p>
    <div class="load" aria-live="polite"><span class="track"><span id="bx-intro-bar"></span></span><span id="bx-intro-status">Acordando a rede…</span></div>
    <div class="acts">
      <button type="button" id="bx-intro-go" disabled><i aria-hidden="true"></i>Entrar ouvindo a Zyra</button>
      <button type="button" id="bx-intro-read" disabled>Só ler</button>
    </div>
  </div>
  <p class="hint">Gire o nome como quiser. Quando parar, ele volta.</p>
</div>
<script src="intro.js"></script>
<div id="dash-root"></div>
<script>
(function () {
  // Small stand-in for the dashboard runtime: the page asks dash.data(id) and gets rows.
  var CORE = ['weather', 'market', 'news', 'ai_news', 'dossier', 'dossier_full', 'geopolitics', 'ibov_trend', 'forces', 'glossary', 'narration'];
  var DATA = {}, calcs = {}, draws = [], loaded = false, stamp = '';
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  // nested arrays/objects arrive as JSON strings, exactly as on the original dashboard
  var flat = function (rows) { return rows.map(function (r) { var o = {}; Object.keys(r).forEach(function (k) { var v = r[k]; o[k] = (v && typeof v === 'object') ? JSON.stringify(v) : v; }); return o; }); };
  var ok = function (rows) { return { status: 'ok', data: rows, rows: rows, columns: rows.length ? Object.keys(rows[0]) : [], message: '', refreshing: false, meta: [] }; };
  var run = function () { draws.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); };
  window.dash = {
    data: function (id) {
      if (!loaded) return { status: 'loading', data: [], message: 'carregando' };
      if (DATA[id]) return ok(flat(clone(DATA[id])));
      var c = calcs[id];
      if (c) { try { return ok(c.fn.apply(null, c.inputs.map(function (i) { return clone(DATA[i] || []); }))); } catch (e) { return { status: 'error', data: [], message: String(e) }; } }
      return { status: 'missing', data: [], message: 'sem dados' };
    },
    onData: function (fn) { draws.push(fn); if (loaded) { try { fn(); } catch (e) { console.error(e); } } },
    calc: function (id, o) { calcs[id] = o; },
    loader: function () {}, colors: [], refresh: function () {}, params: function () { return {}; },
    setParams: function () {}, resetParams: function () {}, setLink: function () {}
  };
  window.__bxAudioUrl = function (name, key) { return 'data/audio/' + name + '/' + key + '.mp3?v=' + encodeURIComponent(stamp); };
  // redraw only when the width changes: on phones the address bar changes the height while scrolling,
  // and a full redraw there replays every entrance animation and makes the page blink
  var rt, lastW = window.innerWidth; window.addEventListener('resize', function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(run, 60); });

  var get = function (url) { return fetch(url + (url.indexOf('?') < 0 ? '?t=' : '&t=') + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r; }); };

  get('page.html').then(function (r) { return r.text(); }).then(function (page) {
    var t = document.createElement('template'); t.innerHTML = page;
    var links = t.content.querySelectorAll('link[rel=stylesheet]');
    for (var i = 0; i < links.length; i++) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = links[i].getAttribute('href'); document.head.appendChild(l); links[i].remove(); }
    var scripts = Array.prototype.map.call(t.content.querySelectorAll('script'), function (s) { return s.textContent; });
    t.content.querySelectorAll('script').forEach(function (n) { n.remove(); });
    document.getElementById('dash-root').replaceChildren(t.content);
    scripts.forEach(function (s) { try { Function('dash', '(function () {' + s + '\n}).call(this);')(window.dash); } catch (e) { console.error('script: ' + e.stack); } });
    return get('data/meta.json').then(function (r) { return r.json(); }).catch(function () { return {}; });
  }).then(function (meta) {
    stamp = (meta && (meta.audio_stamp || meta.generated_at)) || String(Date.now());
    var LABEL = { weather: 'o clima', market: 'o mercado', news: 'as notícias', ai_news: 'a IA', dossier: 'o dossiê', dossier_full: 'o dossiê completo', geopolitics: 'a geopolítica', ibov_trend: 'o Ibovespa', forces: 'o mapa de forças', glossary: 'o glossário', narration: 'a voz da Zyra' };
    var got = 0, tick = function (id) { got++; if (window.__intro) window.__intro.step(LABEL[id] || id, got, CORE.length); };
    return Promise.all(CORE.map(function (id) {
      return get('data/' + id + '.json').then(function (r) { return r.json(); }).then(function (rows) { DATA[id] = rows; }).catch(function (e) { console.warn('sem ' + id, e.message); }).then(function () { tick(id); });
    }));
  }).then(function () {
    loaded = true; run();
    if (window.__intro) window.__intro.ready();
  }).catch(function (e) {
    if (window.__intro) window.__intro.fail('Não consegui carregar o briefing. Puxe a página para atualizar.');
    console.error(e);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
