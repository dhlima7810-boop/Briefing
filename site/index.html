<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Briefing Diário</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; background: #000; color: #e4e4e6; }
  #dash-root { padding: 0 var(--dash-gutter, 0); min-height: 100vh; }
  #bx-boot { position: fixed; inset: 0; display: grid; place-items: center; font: 15px/1.4 system-ui, sans-serif; color: #a6a6ab; background: #000; z-index: 50; transition: opacity .4s; }
  #bx-boot.off { opacity: 0; pointer-events: none; }
</style>
<script src="vendor/d3.min.js"></script>
</head>
<body>
<div id="bx-boot">Carregando o briefing…</div>
<div id="dash-root"></div>
<script>
(function () {
  // Small stand-in for the dashboard runtime: the page asks dash.data(id) and gets rows.
  var CORE = ['weather', 'market', 'news', 'ai_news', 'dossier', 'dossier_full', 'geopolitics', 'ibov_trend', 'forces', 'narration'];
  var DATA = {}, calcs = {}, draws = [], loaded = false, stamp = '';
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  // nested arrays/objects arrive as JSON strings, exactly as on the original dashboard
  var flat = function (rows) { return rows.map(function (r) { var o = {}; Object.keys(r).forEach(function (k) { var v = r[k]; o[k] = (v && typeof v === 'object') ? JSON.stringify(v) : v; }); return o; }); };
  var ok = function (rows) { return { status: 'ok', data: rows, rows: rows, columns: rows.length ? Object.keys(rows[0]) : [], message: '', refreshing: false, meta: [] }; };
  var run = function () { draws.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); };
  window.dash = {
    data: function (id) {
      if (!loaded) return { status: 'loading', data: [], message: 'carregando' };
      if (DATA[id]) return ok(flat(clone(DATA[id])));
      var c = calcs[id];
      if (c) { try { return ok(c.fn.apply(null, c.inputs.map(function (i) { return clone(DATA[i] || []); }))); } catch (e) { return { status: 'error', data: [], message: String(e) }; } }
      return { status: 'missing', data: [], message: 'sem dados' };
    },
    onData: function (fn) { draws.push(fn); if (loaded) { try { fn(); } catch (e) { console.error(e); } } },
    calc: function (id, o) { calcs[id] = o; },
    loader: function () {}, colors: [], refresh: function () {}, params: function () { return {}; },
    setParams: function () {}, resetParams: function () {}, setLink: function () {}
  };
  window.__bxAudioUrl = function (name, key) { return 'data/audio/' + name + '/' + key + '.mp3?v=' + encodeURIComponent(stamp); };
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(run, 60); });

  var get = function (url) { return fetch(url + (url.indexOf('?') < 0 ? '?t=' : '&t=') + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r; }); };

  get('page.html').then(function (r) { return r.text(); }).then(function (page) {
    var t = document.createElement('template'); t.innerHTML = page;
    var links = t.content.querySelectorAll('link[rel=stylesheet]');
    for (var i = 0; i < links.length; i++) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = links[i].getAttribute('href'); document.head.appendChild(l); links[i].remove(); }
    var scripts = Array.prototype.map.call(t.content.querySelectorAll('script'), function (s) { return s.textContent; });
    t.content.querySelectorAll('script').forEach(function (n) { n.remove(); });
    document.getElementById('dash-root').replaceChildren(t.content);
    scripts.forEach(function (s) { try { Function('dash', '(function () {' + s + '\n}).call(this);')(window.dash); } catch (e) { console.error('script: ' + e.stack); } });
    return get('data/meta.json').then(function (r) { return r.json(); }).catch(function () { return {}; });
  }).then(function (meta) {
    stamp = (meta && (meta.audio_stamp || meta.generated_at)) || String(Date.now());
    return Promise.all(CORE.map(function (id) {
      return get('data/' + id + '.json').then(function (r) { return r.json(); }).then(function (rows) { DATA[id] = rows; }).catch(function (e) { console.warn('sem ' + id, e.message); });
    }));
  }).then(function () {
    loaded = true; run();
    document.getElementById('bx-boot').classList.add('off');
  }).catch(function (e) {
    document.getElementById('bx-boot').textContent = 'Não consegui carregar o briefing. Puxe a página para atualizar.';
    console.error(e);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
